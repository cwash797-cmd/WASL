<g transform="translate(410,0)"><g clip-path="url(#clip)"><rect width="380" height="190" rx="20" fill="url(#card)"/><rect width="380" height="2" fill="url(#accent)"/></g><rect width="380" height="190" rx="20" fill="none" stroke="#1e293b"/><g transform="translate(30,28)"><path d="M25 4 L10 26 H21 L19 40 L34 18 H23 Z" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/></g><text x="30" y="112" fill="url(#silver)" font-size="22" font-weight="700">Современные протоколы</text><text x="30" y="142" fill="#8b96a8" font-size="15">VLESS Reality · XHTTP · Hysteria2.</text><text x="30" y="164" fill="#8b96a8" font-size="15">Стабильно там, где другие молчат.</text></g>
<g transform="translate(820,0)"><g clip-path="url(#clip)"><rect width="380" height="190" rx="20" fill="url(#card)"/><rect width="380" height="2" fill="url(#accent)"/></g><rect width="380" height="190" rx="20" fill="none" stroke="#1e293b"/><g transform="translate(30,28)"><circle cx="22" cy="22" r="17" fill="none" stroke="#60a5fa" stroke-width="2.5"/><ellipse cx="22" cy="22" rx="7" ry="17" fill="none" stroke="#60a5fa" stroke-width="2"/><line x1="5" y1="22" x2="39" y2="22" stroke="#60a5fa" stroke-width="2"/><line x1="8" y1="13" x2="36" y2="13" stroke="#60a5fa" stroke-width="1.5"/><line x1="8" y1="31" x2="36" y2="31" stroke="#60a5fa" stroke-width="1.5"/></g><text x="30" y="112" fill="url(#silver)" font-size="22" font-weight="700">Multi-Node сеть</text><text x="30" y="142" fill="#8b96a8" font-size="15">Несколько серверов в одной подписке.</text><text x="30" y="164" fill="#8b96a8" font-size="15">Приложение само выберет лучший.</text></g>
