<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Фон -->
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1c2a2d"/>
      <stop offset="60%" stop-color="#11181b"/>
      <stop offset="100%" stop-color="#0a0d10"/>
    </radialGradient>

    <!-- Внутренний круг с бирюзовым оттенком -->
    <radialGradient id="inner" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#2f6b68" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#16302f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1517"/>
    </radialGradient>

    <!-- Металл (серебро) -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#c9d0d4"/>
      <stop offset="50%" stop-color="#f4f6f7"/>
      <stop offset="75%" stop-color="#9ea7ac"/>
      <stop offset="100%" stop-color="#e6eaec"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f4f5"/>
      <stop offset="50%" stop-color="#a9b2b7"/>
      <stop offset="100%" stop-color="#e9edef"/>
    </linearGradient>

    <!-- Свечение кольца -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
      </feMerge>
    </filter>

    <!-- Тень под текстом -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Бирюзовое свечение -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="#2fd1b8" stroke-width="18" opacity="0.55" filter="url(#glow)"/>

  <!-- Внутренний круг -->
  <circle cx="512" cy="512" r="366" fill="url(#inner)"/>

  <!-- Серебряное кольцо -->
  <circle cx="512" cy="512" r="370" fill="none" stroke="url(#ring)" stroke-width="9"/>

  <!-- Арабская надпись -->
  <text x="512" y="485" text-anchor="middle" direction="rtl"
        font-family="'Aref Ruqaa','Amiri','Noto Naskh Arabic','Scheherazade New',serif"
        font-size="270" fill="url(#metal)" filter="url(#shadow)">وصل</text>

  <!-- WASL -->
  <text x="512" y="655" text-anchor="middle"
        font-family="'Montserrat','Raleway','Helvetica Neue',Arial,sans-serif"
        font-weight="500" font-size="185" letter-spacing="6"
        fill="url(#metal)" filter="url(#shadow)">WASL</text>
</svg>
